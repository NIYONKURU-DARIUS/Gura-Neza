<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Subtle shine overlay on top half -->
  <rect width="64" height="32" rx="16" fill="url(#shine)"/>
  <rect y="16" width="64" height="16" fill="url(#shine)"/>

  <!-- Bold italic "G" letterform -->
  <text
    x="10"
    y="50"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="900"
    font-style="italic"
    font-size="46"
    fill="white"
    letter-spacing="-2"
    opacity="0.97"
  >G</text>

  <!-- Small accent dot — top right -->
  <circle cx="52" cy="13" r="5" fill="#69f0ae" opacity="0.9"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
